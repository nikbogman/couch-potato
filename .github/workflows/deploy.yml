name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      # wrangler's build step runs `bun run build`, which inlines the PUBLIC_PLAYER_* values.
      - run: bun run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PUBLIC_PLAYER_1: ${{ secrets.PUBLIC_PLAYER_1 }}
          PUBLIC_PLAYER_2: ${{ secrets.PUBLIC_PLAYER_2 }}
          PUBLIC_PLAYER_3: ${{ secrets.PUBLIC_PLAYER_3 }}
