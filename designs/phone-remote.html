<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0c0e">
<title>Remote · Working Title</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="phone" style="gap:28px">
  <div class="p-head">
    <h1>Remote</h1>
    <span class="tv-chip"><span class="dot" style="width:8px;height:8px"></span>Living room TV</span>
  </div>

  <section aria-label="Now playing" style="display:flex;flex-direction:column;gap:16px">
    <div class="still ph">STILL · TMDB</div>
    <div style="display:flex;flex-direction:column;gap:2px">
      <span class="muted" style="font-size:13px">Severance · S2 · E4</span>
      <strong style="font-size:22px">Woe’s Hollow</strong>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px">
      <div class="bar" style="background:#26292f"><i style="width:42%"></i></div>
      <div class="times"><span>21:48</span><span>−31:12</span></div>
    </div>
  </section>

  <div class="transport">
    <button aria-label="Back 10 seconds"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#f4f4f5" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 3-6.2"/><path d="M4 4v4h4"/></svg></button>
    <button class="main" aria-label="Play" data-play><svg width="34" height="34" viewBox="0 0 24 24" fill="#0b0c0e" aria-hidden="true"><path d="M7 4l13 8-13 8z"/></svg></button>
    <button aria-label="Forward 10 seconds"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#f4f4f5" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-3-6.2"/><path d="M20 4v4h-4"/></svg></button>
  </div>

  <div class="grid2">
    <button>Switch player</button>
    <button>Next episode</button>
  </div>
</main>

<footer class="tabbar">
  <nav aria-label="Main">
    <a href="#"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9H4z"/></svg>Home</a>
    <a href="phone-lists.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 6h14M5 12h14M5 18h9"/></svg>Lists</a>
    <a href="phone-remote.html" aria-current="page"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="3"/><circle cx="12" cy="9" r="2"/></svg>Remote</a>
    <a href="phone-explore.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M15 9l-2 4-4 2 2-4z"/></svg>Explore</a>
  </nav>
</footer>
<script src="app.js"></script>
</body>
</html>
