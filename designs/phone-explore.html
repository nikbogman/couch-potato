<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0c0e">
<title>Explore · Working Title</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="phone">
  <div class="p-head"><h1>Explore</h1></div>
  <label class="search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9a9da4" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    <input type="search" name="q" aria-label="Search movies and series, or paste a reel link" placeholder="Search or paste a reel link…" autocomplete="off" spellcheck="false">
  </label>

  <section aria-labelledby="reels">
    <div class="section-head"><h2 id="reels">From reels</h2><a href="#">All 6</a></div>
    <ul class="list" aria-live="polite">
      <li>
        <div class="poster sm" style="background:#2e2622"></div>
        <div class="grow"><strong>Prisoners</strong><span>Found · 2013 · Thriller</span></div>
        <button class="small-btn primary">Add to To watch</button>
      </li>
      <li>
        <div class="poster sm"><svg class="spin" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f5b544" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9"/></svg></div>
        <div class="grow"><strong style="color:var(--ink-soft)">Reading reel…</strong><span>@cinemaclips · shared 1 min ago</span></div>
      </li>
      <li>
        <div class="poster sm"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9a9da4" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 8v5M12 16h.01"/></svg></div>
        <div class="grow"><strong style="color:var(--ink-soft)">Not found</strong><span>No title in the comments</span></div>
        <button class="small-btn">Remove</button>
      </li>
      <li>
        <div class="poster sm"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9a9da4" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 3-6.2"/><path d="M4 4v4h4"/></svg></div>
        <div class="grow"><strong style="color:var(--ink-soft)">Failed</strong><span>The reel could not be opened</span></div>
        <button class="small-btn">Retry</button>
      </li>
    </ul>
  </section>

  <section aria-labelledby="trend" style="display:flex;flex-direction:column;gap:12px">
    <h2 id="trend">Trending this week</h2>
    <div class="shelf">
      <figure><div style="background:#2e2228"></div><figcaption>Anora</figcaption></figure>
      <figure><div style="background:#2a2320"></div><figcaption>Conclave</figcaption></figure>
      <figure><div style="background:#22262c"></div><figcaption>The Brutalist</figcaption></figure>
      <figure><div style="background:#1e1e22"></div><figcaption>Nosferatu</figcaption></figure>
      <figure><div style="background:#262a22"></div><figcaption>Flow</figcaption></figure>
    </div>
  </section>
</main>

<footer class="tabbar">
  <nav aria-label="Main">
    <a href="#"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9H4z"/></svg>Home</a>
    <a href="phone-lists.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 6h14M5 12h14M5 18h9"/></svg>Lists</a>
    <a href="phone-remote.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="3"/><circle cx="12" cy="9" r="2"/></svg>Remote</a>
    <a href="phone-explore.html" aria-current="page"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M15 9l-2 4-4 2 2-4z"/></svg>Explore</a>
  </nav>
</footer>
<script src="app.js"></script>
</body>
</html>
