<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Remote</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 720px; height: 440px; box-sizing: border-box; padding: 56px; background: #16181c; color: #f4f4f5; font-family: Inter, system-ui, sans-serif; display: flex; gap: 56px; align-items: center">
<svg width="280" height="280" viewBox="0 0 32 32" role="img" aria-label="A potato-shaped remote whose eyes are its buttons"><rect width="32" height="32" rx="9" fill="#0b0c0e"></rect><g transform="translate(4 4)"><path d="M8 6.5C8 4.2 9.8 3 12.2 3s4.3 1.4 4.2 3.8c-.1 2.2-.9 3.6-.8 6 .1 2.7 1.3 4.2 1 6.2-.3 1.6-2 2.5-4.6 2.5s-4.4-1.1-4.5-3c-.1-2 1.2-3.4 1.1-6.2C8.5 10.1 8 8.6 8 6.5z" fill="none" stroke="#F5B544" stroke-width="1.8" stroke-linejoin="round"></path><circle cx="12.2" cy="7.6" r="1.9" fill="none" stroke="#F5B544" stroke-width="1.5"></circle><g fill="#F5B544"><circle cx="11" cy="13.2" r=".95"></circle><circle cx="13.5" cy="14.8" r=".95"></circle><circle cx="11.8" cy="17.6" r=".95"></circle></g></g></svg>
<div style="display: flex; flex-direction: column; gap: 48px; flex: 1">
<div style="display: flex; align-items: flex-end; gap: 24px">
<sc-for list="{{sizes}}" as="s" hint-placeholder-count="3"><svg width="{{s.px}}" height="{{s.px}}" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#0b0c0e"></rect><g transform="translate(4 4)"><path d="M8 6.5C8 4.2 9.8 3 12.2 3s4.3 1.4 4.2 3.8c-.1 2.2-.9 3.6-.8 6 .1 2.7 1.3 4.2 1 6.2-.3 1.6-2 2.5-4.6 2.5s-4.4-1.1-4.5-3c-.1-2 1.2-3.4 1.1-6.2C8.5 10.1 8 8.6 8 6.5z" fill="none" stroke="#F5B544" stroke-width="1.8" stroke-linejoin="round"></path><circle cx="12.2" cy="7.6" r="1.9" fill="none" stroke="#F5B544" stroke-width="1.5"></circle><g fill="#F5B544"><circle cx="11" cy="13.2" r=".95"></circle><circle cx="13.5" cy="14.8" r=".95"></circle><circle cx="11.8" cy="17.6" r=".95"></circle></g></g></svg></sc-for>
</div>
<div style="display: flex; align-items: center; gap: 14px">
<svg width="44" height="44" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#0b0c0e"></rect><g transform="translate(4 4)"><path d="M8 6.5C8 4.2 9.8 3 12.2 3s4.3 1.4 4.2 3.8c-.1 2.2-.9 3.6-.8 6 .1 2.7 1.3 4.2 1 6.2-.3 1.6-2 2.5-4.6 2.5s-4.4-1.1-4.5-3c-.1-2 1.2-3.4 1.1-6.2C8.5 10.1 8 8.6 8 6.5z" fill="none" stroke="#F5B544" stroke-width="1.8" stroke-linejoin="round"></path><circle cx="12.2" cy="7.6" r="1.9" fill="none" stroke="#F5B544" stroke-width="1.5"></circle><g fill="#F5B544"><circle cx="11" cy="13.2" r=".95"></circle><circle cx="13.5" cy="14.8" r=".95"></circle><circle cx="11.8" cy="17.6" r=".95"></circle></g></g></svg>
<span style="font-size: 30px; font-weight: 700; letter-spacing: -0.02em">couch potato</span>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":720,"height":440}}'>
class Component extends DCLogic {
renderVals() {
return { sizes: [{ px: 64 }, { px: 32 }, { px: 16 }] };
}
}
</script>
</body>
</html>
