<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lit by the screen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&amp;display=swap" rel="stylesheet">

<div style="width: 720px; height: 440px; box-sizing: border-box; padding: 56px; background: #16181c; color: #f4f4f5; font-family: Inter, system-ui, sans-serif; display: flex; gap: 56px; align-items: center">
<svg width="280" height="280" viewBox="0 0 32 32" role="img" aria-label="A potato watching a screen, its face lit on the side facing it"><defs><clipPath id="glow-spud"><path d="M8 13.4c0-3.6 3-6 7-6s6.6 2.3 6.6 5.4c0 3.6-3 5.4-7 5.4S8 16.8 8 13.4z"></path></clipPath></defs><rect width="32" height="32" rx="9" fill="#0b0c0e"></rect><g transform="translate(4 4)"><rect x="1" y="6" width="5" height="9" rx="1.2" fill="#f4f4f5"></rect><path d="M8 13.4c0-3.6 3-6 7-6s6.6 2.3 6.6 5.4c0 3.6-3 5.4-7 5.4S8 16.8 8 13.4z" fill="#F5B544"></path><g clip-path="url(#glow-spud)"><path d="M10 13.4c0-3.6 3-6 7-6s6.6 2.3 6.6 5.4c0 3.6-3 5.4-7 5.4S10 16.8 10 13.4z" fill="#8a5c17"></path></g><g fill="#0b0c0e"><circle cx="11.2" cy="12.2" r=".85"></circle><circle cx="14.8" cy="11.8" r=".85"></circle></g></g></svg>
<div style="display: flex; flex-direction: column; gap: 48px; flex: 1">

<sc-for list="{{sizes}}" as="s" hint-placeholder-count="3"><svg width="{{s.px}}" height="{{s.px}}" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#0b0c0e"></rect><g transform="translate(4 4)"><rect x="1" y="6" width="5" height="9" rx="1.2" fill="#f4f4f5"></rect><path d="M8 13.4c0-3.6 3-6 7-6s6.6 2.3 6.6 5.4c0 3.6-3 5.4-7 5.4S8 16.8 8 13.4z" fill="#F5B544"></path><g clip-path="url(#glow-spud)"><path d="M10 13.4c0-3.6 3-6 7-6s6.6 2.3 6.6 5.4c0 3.6-3 5.4-7 5.4S10 16.8 10 13.4z" fill="#8a5c17"></path></g><g fill="#0b0c0e"><circle cx="11.2" cy="12.2" r=".85"></circle><circle cx="14.8" cy="11.8" r=".85"></circle></g></g></svg></sc-for>
</div>
<div style="display: flex; align-items: center; gap: 14px">
<svg width="44" height="44" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#0b0c0e"></rect><g transform="translate(4 4)"><rect x="1" y="6" width="5" height="9" rx="1.2" fill="#f4f4f5"></rect><path d="M8 13.4c0-3.6 3-6 7-6s6.6 2.3 6.6 5.4c0 3.6-3 5.4-7 5.4S8 16.8 8 13.4z" fill="#F5B544"></path><g clip-path="url(#glow-spud)"><path d="M10 13.4c0-3.6 3-6 7-6s6.6 2.3 6.6 5.4c0 3.6-3 5.4-7 5.4S10 16.8 10 13.4z" fill="#8a5c17"></path></g><g fill="#0b0c0e"><circle cx="11.2" cy="12.2" r=".85"></circle><circle cx="14.8" cy="11.8" r=".85"></circle></g></g></svg>
<span style="font-size: 30px; font-weight: 700; letter-spacing: -0.02em">couch potato</span>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":720,"height":440}}'>

renderVals() {
return { sizes: [{ px: 64 }, { px: 32 }, { px: 16 }] };
