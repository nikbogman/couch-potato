<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dent</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 720px; height: 440px; box-sizing: border-box; padding: 56px; background: #16181c; color: #f4f4f5; font-family: Inter, system-ui, sans-serif; display: flex; gap: 56px; align-items: center">
<svg width="280" height="280" viewBox="0 0 32 32" role="img" aria-label="A cushion with a potato-shaped dent"><rect width="32" height="32" rx="9" fill="#0b0c0e"></rect><g transform="translate(4 4)"><rect x="2.5" y="4.5" width="19" height="15" rx="4.5" fill="#F5B544"></rect><path d="M7 12.4c0-2.4 2.2-4 5.1-4 3 0 4.9 1.5 4.9 3.6 0 2.3-1.9 3.6-5.1 3.6C9 15.6 7 14.6 7 12.4z" fill="#a8721c"></path><g fill="#0b0c0e" fill-opacity=".55"><circle cx="5.5" cy="7.5" r=".6"></circle><circle cx="18.5" cy="7.5" r=".6"></circle><circle cx="5.5" cy="16.5" r=".6"></circle><circle cx="18.5" cy="16.5" r=".6"></circle></g></g></svg>
<div style="display: flex; flex-direction: column; gap: 48px; flex: 1">
<div style="display: flex; align-items: flex-end; gap: 24px">
<sc-for list="{{sizes}}" as="s" hint-placeholder-count="3"><svg width="{{s.px}}" height="{{s.px}}" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#0b0c0e"></rect><g transform="translate(4 4)"><rect x="2.5" y="4.5" width="19" height="15" rx="4.5" fill="#F5B544"></rect><path d="M7 12.4c0-2.4 2.2-4 5.1-4 3 0 4.9 1.5 4.9 3.6 0 2.3-1.9 3.6-5.1 3.6C9 15.6 7 14.6 7 12.4z" fill="#a8721c"></path><g fill="#0b0c0e" fill-opacity=".55"><circle cx="5.5" cy="7.5" r=".6"></circle><circle cx="18.5" cy="7.5" r=".6"></circle><circle cx="5.5" cy="16.5" r=".6"></circle><circle cx="18.5" cy="16.5" r=".6"></circle></g></g></svg></sc-for>
</div>
<div style="display: flex; align-items: center; gap: 14px">
<svg width="44" height="44" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#0b0c0e"></rect><g transform="translate(4 4)"><rect x="2.5" y="4.5" width="19" height="15" rx="4.5" fill="#F5B544"></rect><path d="M7 12.4c0-2.4 2.2-4 5.1-4 3 0 4.9 1.5 4.9 3.6 0 2.3-1.9 3.6-5.1 3.6C9 15.6 7 14.6 7 12.4z" fill="#a8721c"></path></g></svg>
<span style="font-size: 30px; font-weight: 700; letter-spacing: -0.02em">couch potato</span>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":720,"height":440}}'>
class Component extends DCLogic {
renderVals() {
return { sizes: [{ px: 64 }, { px: 32 }, { px: 16 }] };
}
}
</script>
</body>
</html>
