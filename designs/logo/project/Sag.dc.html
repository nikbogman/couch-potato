<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sag</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 720px; height: 440px; box-sizing: border-box; padding: 56px; background: #16181c; color: #f4f4f5; font-family: Inter, system-ui, sans-serif; display: flex; gap: 56px; align-items: center">
<svg width="280" height="280" viewBox="0 0 32 32" role="img" aria-label="Lowercase cp sinking into a sagging cushion line"><rect width="32" height="32" rx="9" fill="#0b0c0e"></rect><g transform="translate(4 4)"><text font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="14" fill="#F5B544" letter-spacing="-0.6"><tspan x="4.2" y="15.6">c</tspan><tspan x="12" y="16.6">p</tspan></text><path d="M2.5 17.2Q12 22.6 21.5 17.2" fill="none" stroke="#f4f4f5" stroke-width="1.5" stroke-linecap="round"></path></g></svg>
<div style="display: flex; flex-direction: column; gap: 48px; flex: 1">
<div style="display: flex; align-items: flex-end; gap: 24px">
<sc-for list="{{sizes}}" as="s" hint-placeholder-count="3"><svg width="{{s.px}}" height="{{s.px}}" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#0b0c0e"></rect><g transform="translate(4 4)"><text font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="14" fill="#F5B544" letter-spacing="-0.6"><tspan x="4.2" y="15.6">c</tspan><tspan x="12" y="16.6">p</tspan></text><path d="M2.5 17.2Q12 22.6 21.5 17.2" fill="none" stroke="#f4f4f5" stroke-width="1.5" stroke-linecap="round"></path></g></svg></sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; font-size: 34px; font-weight: 800; letter-spacing: -0.02em; white-space: pre">
<sc-for list="{{letters}}" as="l" hint-placeholder-count="12"><span style="display: inline-block; transform: translateY({{l.y}}px)">{{l.ch}}</span></sc-for>
</div>
<svg width="236" height="14" viewBox="0 0 236 14" aria-hidden="true"><path d="M2 2Q118 22 234 2" fill="none" stroke="#F5B544" stroke-width="2.5" stroke-linecap="round"></path></svg>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":720,"height":440}}'>
class Component extends DCLogic {
renderVals() {
const word = 'couch potato';
const n = word.length - 1;
const letters = word.split('').map((ch, i) => ({ ch, y: Math.round(Math.sin((i / n) * Math.PI) * 9) }));
return { sizes: [{ px: 64 }, { px: 32 }, { px: 16 }], letters };
}
}
</script>
</body>
</html>
