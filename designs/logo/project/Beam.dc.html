<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Beam</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 720px; height: 440px; box-sizing: border-box; padding: 56px; background: #16181c; color: #f4f4f5; font-family: Inter, system-ui, sans-serif; display: flex; gap: 56px; align-items: center">
<svg width="280" height="280" viewBox="0 0 32 32" role="img" aria-label="A potato arcing from a phone to a TV"><rect width="32" height="32" rx="9" fill="#0b0c0e"></rect><g transform="translate(4 4)"><rect x="2.5" y="11" width="6" height="10" rx="1.5" fill="none" stroke="#f4f4f5" stroke-width="1.5"></rect><rect x="12" y="11" width="9.5" height="7" rx="1.5" fill="none" stroke="#f4f4f5" stroke-width="1.5"></rect><path d="M16 20.5h1.5" stroke="#f4f4f5" stroke-width="1.5" stroke-linecap="round"></path><path d="M5.5 9C6.5 4 13 2.5 16.5 8.5" fill="none" stroke="#F5B544" stroke-width="1.3" stroke-linecap="round" stroke-dasharray=".1 2.2"></path><ellipse cx="13" cy="4.6" rx="2.4" ry="1.9" fill="#F5B544" transform="rotate(-15 13 4.6)"></ellipse></g></svg>
<div style="display: flex; flex-direction: column; gap: 48px; flex: 1">
<div style="display: flex; align-items: flex-end; gap: 24px">
<sc-for list="{{sizes}}" as="s" hint-placeholder-count="3"><svg width="{{s.px}}" height="{{s.px}}" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#0b0c0e"></rect><g transform="translate(4 4)"><rect x="2.5" y="11" width="6" height="10" rx="1.5" fill="none" stroke="#f4f4f5" stroke-width="1.5"></rect><rect x="12" y="11" width="9.5" height="7" rx="1.5" fill="none" stroke="#f4f4f5" stroke-width="1.5"></rect><path d="M16 20.5h1.5" stroke="#f4f4f5" stroke-width="1.5" stroke-linecap="round"></path><path d="M5.5 9C6.5 4 13 2.5 16.5 8.5" fill="none" stroke="#F5B544" stroke-width="1.3" stroke-linecap="round" stroke-dasharray=".1 2.2"></path><ellipse cx="13" cy="4.6" rx="2.4" ry="1.9" fill="#F5B544" transform="rotate(-15 13 4.6)"></ellipse></g></svg></sc-for>
</div>
<div style="display: flex; align-items: center; gap: 14px">
<svg width="44" height="44" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#0b0c0e"></rect><g transform="translate(4 4)"><rect x="2.5" y="11" width="6" height="10" rx="1.5" fill="none" stroke="#f4f4f5" stroke-width="1.5"></rect><rect x="12" y="11" width="9.5" height="7" rx="1.5" fill="none" stroke="#f4f4f5" stroke-width="1.5"></rect><path d="M16 20.5h1.5" stroke="#f4f4f5" stroke-width="1.5" stroke-linecap="round"></path><path d="M5.5 9C6.5 4 13 2.5 16.5 8.5" fill="none" stroke="#F5B544" stroke-width="1.3" stroke-linecap="round" stroke-dasharray=".1 2.2"></path><ellipse cx="13" cy="4.6" rx="2.4" ry="1.9" fill="#F5B544" transform="rotate(-15 13 4.6)"></ellipse></g></svg>
<span style="font-size: 30px; font-weight: 700; letter-spacing: -0.02em">couch potato</span>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":720,"height":440}}'>
class Component extends DCLogic {
renderVals() {
return { sizes: [{ px: 64 }, { px: 32 }, { px: 16 }] };
}
}
</script>
</body>
</html>
