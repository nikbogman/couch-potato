<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Peek</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 720px; height: 440px; box-sizing: border-box; padding: 56px; background: #16181c; color: #f4f4f5; font-family: Inter, system-ui, sans-serif; display: flex; gap: 56px; align-items: center">
<svg width="280" height="280" viewBox="0 0 32 32" role="img" aria-label="A head peeking over the back of a couch, silhouetted against a glowing screen"><rect width="32" height="32" rx="9" fill="#0b0c0e"></rect><g transform="translate(4 4)"><rect x="4" y="2.5" width="16" height="11" rx="1.8" fill="#F5B544"></rect><ellipse cx="12" cy="11.2" rx="2.9" ry="2.4" fill="#0b0c0e"></ellipse><path d="M2.5 20.5v-6a2.5 2.5 0 0 1 2.5-2.5h14a2.5 2.5 0 0 1 2.5 2.5v6z" fill="#0b0c0e" stroke="#f4f4f5" stroke-width="1.6" stroke-linejoin="round"></path></g></svg>
<div style="display: flex; flex-direction: column; gap: 48px; flex: 1">
<div style="display: flex; align-items: flex-end; gap: 24px">
<sc-for list="{{sizes}}" as="s" hint-placeholder-count="3"><svg width="{{s.px}}" height="{{s.px}}" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#0b0c0e"></rect><g transform="translate(4 4)"><rect x="4" y="2.5" width="16" height="11" rx="1.8" fill="#F5B544"></rect><ellipse cx="12" cy="11.2" rx="2.9" ry="2.4" fill="#0b0c0e"></ellipse><path d="M2.5 20.5v-6a2.5 2.5 0 0 1 2.5-2.5h14a2.5 2.5 0 0 1 2.5 2.5v6z" fill="#0b0c0e" stroke="#f4f4f5" stroke-width="1.6" stroke-linejoin="round"></path></g></svg></sc-for>
</div>
<div style="display: flex; align-items: center; gap: 14px">
<svg width="44" height="44" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#0b0c0e"></rect><g transform="translate(4 4)"><rect x="4" y="2.5" width="16" height="11" rx="1.8" fill="#F5B544"></rect><ellipse cx="12" cy="11.2" rx="2.9" ry="2.4" fill="#0b0c0e"></ellipse><path d="M2.5 20.5v-6a2.5 2.5 0 0 1 2.5-2.5h14a2.5 2.5 0 0 1 2.5 2.5v6z" fill="#0b0c0e" stroke="#f4f4f5" stroke-width="1.6" stroke-linejoin="round"></path></g></svg>
<span style="font-size: 30px; font-weight: 700; letter-spacing: -0.02em">couch potato</span>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":720,"height":440}}'>
class Component extends DCLogic {
renderVals() {
return { sizes: [{ px: 64 }, { px: 32 }, { px: 16 }] };
}
}
</script>
</body>
</html>
