<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Riding the progress bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 720px; height: 440px; box-sizing: border-box; padding: 56px; background: #16181c; color: #f4f4f5; font-family: Inter, system-ui, sans-serif; display: flex; gap: 56px; align-items: center">
<svg width="280" height="280" viewBox="0 0 32 32" role="img" aria-label="A smiling potato sitting on a video progress bar"><rect width="32" height="32" rx="9" fill="#0b0c0e"></rect><g transform="translate(4 4)"><path d="M2.5 19.5h19" stroke="#f4f4f5" stroke-opacity=".3" stroke-width="2.2" stroke-linecap="round"></path><path d="M2.5 19.5h10" stroke="#F5B544" stroke-width="2.2" stroke-linecap="round"></path><path d="M6 12.8c0-3.3 2.9-5.6 6.6-5.6 3.9 0 6.2 2.1 6.2 5 0 3.1-2.7 4.8-6.6 4.8S6 15.6 6 12.8z" fill="#F5B544"></path><g fill="#0b0c0e"><circle cx="10.6" cy="11.4" r=".8"></circle><circle cx="14.6" cy="11" r=".8"></circle></g><path d="M11.3 13.7q1.3 1 2.6 0" fill="none" stroke="#0b0c0e" stroke-width=".9" stroke-linecap="round"></path></g></svg>
<div style="display: flex; flex-direction: column; gap: 48px; flex: 1">
<div style="display: flex; align-items: flex-end; gap: 24px">
<sc-for list="{{sizes}}" as="s" hint-placeholder-count="3"><svg width="{{s.px}}" height="{{s.px}}" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#0b0c0e"></rect><g transform="translate(4 4)"><path d="M2.5 19.5h19" stroke="#f4f4f5" stroke-opacity=".3" stroke-width="2.2" stroke-linecap="round"></path><path d="M2.5 19.5h10" stroke="#F5B544" stroke-width="2.2" stroke-linecap="round"></path><path d="M6 12.8c0-3.3 2.9-5.6 6.6-5.6 3.9 0 6.2 2.1 6.2 5 0 3.1-2.7 4.8-6.6 4.8S6 15.6 6 12.8z" fill="#F5B544"></path><g fill="#0b0c0e"><circle cx="10.6" cy="11.4" r=".8"></circle><circle cx="14.6" cy="11" r=".8"></circle></g><path d="M11.3 13.7q1.3 1 2.6 0" fill="none" stroke="#0b0c0e" stroke-width=".9" stroke-linecap="round"></path></g></svg></sc-for>
</div>
<div style="display: flex; align-items: center; gap: 14px">
<svg width="44" height="44" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#0b0c0e"></rect><g transform="translate(4 4)"><path d="M2.5 19.5h19" stroke="#f4f4f5" stroke-opacity=".3" stroke-width="2.2" stroke-linecap="round"></path><path d="M2.5 19.5h10" stroke="#F5B544" stroke-width="2.2" stroke-linecap="round"></path><path d="M6 12.8c0-3.3 2.9-5.6 6.6-5.6 3.9 0 6.2 2.1 6.2 5 0 3.1-2.7 4.8-6.6 4.8S6 15.6 6 12.8z" fill="#F5B544"></path><g fill="#0b0c0e"><circle cx="10.6" cy="11.4" r=".8"></circle><circle cx="14.6" cy="11" r=".8"></circle></g><path d="M11.3 13.7q1.3 1 2.6 0" fill="none" stroke="#0b0c0e" stroke-width=".9" stroke-linecap="round"></path></g></svg>
<span style="font-size: 30px; font-weight: 700; letter-spacing: -0.02em">couch potato</span>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":720,"height":440}}'>
class Component extends DCLogic {
renderVals() {
return { sizes: [{ px: 64 }, { px: 32 }, { px: 16 }] };
}
}
</script>
</body>
</html>
