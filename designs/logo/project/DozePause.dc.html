<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pause-bar eyes</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 720px; height: 440px; box-sizing: border-box; padding: 56px; background: #16181c; color: #f4f4f5; font-family: Inter, system-ui, sans-serif; display: flex; gap: 56px; align-items: center">
<svg width="280" height="280" viewBox="0 0 32 32" role="img" aria-label="A potato whose two eyes form a pause symbol"><rect width="32" height="32" rx="9" fill="#0b0c0e"></rect><g transform="translate(4 4)"><path d="M3.5 12.6c0-4 3.6-6.8 8.4-6.8 5 0 8.1 2.6 8.1 6.2 0 4-3.6 6.2-8.4 6.2S3.5 16.2 3.5 12.6z" fill="#F5B544"></path><g fill="#0b0c0e"><rect x="8.9" y="9.6" width="1.8" height="4.4" rx=".9"></rect><rect x="13.1" y="9.4" width="1.8" height="4.4" rx=".9"></rect></g></g></svg>
<div style="display: flex; flex-direction: column; gap: 48px; flex: 1">
<div style="display: flex; align-items: flex-end; gap: 24px">
<sc-for list="{{sizes}}" as="s" hint-placeholder-count="3"><svg width="{{s.px}}" height="{{s.px}}" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#0b0c0e"></rect><g transform="translate(4 4)"><path d="M3.5 12.6c0-4 3.6-6.8 8.4-6.8 5 0 8.1 2.6 8.1 6.2 0 4-3.6 6.2-8.4 6.2S3.5 16.2 3.5 12.6z" fill="#F5B544"></path><g fill="#0b0c0e"><rect x="8.9" y="9.6" width="1.8" height="4.4" rx=".9"></rect><rect x="13.1" y="9.4" width="1.8" height="4.4" rx=".9"></rect></g></g></svg></sc-for>
</div>
<div style="display: flex; align-items: center; gap: 14px">
<svg width="44" height="44" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#0b0c0e"></rect><g transform="translate(4 4)"><path d="M3.5 12.6c0-4 3.6-6.8 8.4-6.8 5 0 8.1 2.6 8.1 6.2 0 4-3.6 6.2-8.4 6.2S3.5 16.2 3.5 12.6z" fill="#F5B544"></path><g fill="#0b0c0e"><rect x="8.9" y="9.6" width="1.8" height="4.4" rx=".9"></rect><rect x="13.1" y="9.4" width="1.8" height="4.4" rx=".9"></rect></g></g></svg>
<span style="font-size: 30px; font-weight: 700; letter-spacing: -0.02em">couch potato</span>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":720,"height":440}}'>
class Component extends DCLogic {
renderVals() {
return { sizes: [{ px: 64 }, { px: 32 }, { px: 16 }] };
}
}
</script>
</body>
</html>
