<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Playhead</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 720px; height: 440px; box-sizing: border-box; padding: 56px; background: #16181c; color: #f4f4f5; font-family: Inter, system-ui, sans-serif; display: flex; gap: 56px; align-items: center">
<svg width="280" height="280" viewBox="0 0 32 32" role="img" aria-label="A progress bar with a potato as the playhead"><rect width="32" height="32" rx="9" fill="#0b0c0e"></rect><g transform="translate(4 4)"><path d="M2.5 15h19" stroke="#f4f4f5" stroke-opacity=".35" stroke-width="2.4" stroke-linecap="round"></path><path d="M2.5 15h9" stroke="#F5B544" stroke-width="2.4" stroke-linecap="round"></path><path d="M9 14c0-2.6 1.9-4.4 4.6-4.4s4.4 1.7 4.4 4c0 2.6-2 4-4.7 4S9 16.4 9 14z" fill="#F5B544"></path><g fill="#0b0c0e"><circle cx="12" cy="12.8" r=".7"></circle><circle cx="15.4" cy="13.6" r=".6"></circle></g></g></svg>
<div style="display: flex; flex-direction: column; gap: 48px; flex: 1">
<div style="display: flex; align-items: flex-end; gap: 24px">
<sc-for list="{{sizes}}" as="s" hint-placeholder-count="3"><svg width="{{s.px}}" height="{{s.px}}" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#0b0c0e"></rect><g transform="translate(4 4)"><path d="M2.5 15h19" stroke="#f4f4f5" stroke-opacity=".35" stroke-width="2.4" stroke-linecap="round"></path><path d="M2.5 15h9" stroke="#F5B544" stroke-width="2.4" stroke-linecap="round"></path><path d="M9 14c0-2.6 1.9-4.4 4.6-4.4s4.4 1.7 4.4 4c0 2.6-2 4-4.7 4S9 16.4 9 14z" fill="#F5B544"></path><g fill="#0b0c0e"><circle cx="12" cy="12.8" r=".7"></circle><circle cx="15.4" cy="13.6" r=".6"></circle></g></g></svg></sc-for>
</div>
<div style="display: flex; align-items: center; gap: 14px">
<svg width="44" height="44" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#0b0c0e"></rect><g transform="translate(4 4)"><path d="M2.5 15h19" stroke="#f4f4f5" stroke-opacity=".35" stroke-width="2.4" stroke-linecap="round"></path><path d="M2.5 15h9" stroke="#F5B544" stroke-width="2.4" stroke-linecap="round"></path><path d="M9 14c0-2.6 1.9-4.4 4.6-4.4s4.4 1.7 4.4 4c0 2.6-2 4-4.7 4S9 16.4 9 14z" fill="#F5B544"></path></g></svg>
<span style="font-size: 30px; font-weight: 700; letter-spacing: -0.02em">couch potato</span>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":720,"height":440}}'>
class Component extends DCLogic {
renderVals() {
return { sizes: [{ px: 64 }, { px: 32 }, { px: 16 }] };
}
}
</script>
</body>
</html>
