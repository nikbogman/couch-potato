<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Potato TV set</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 720px; height: 440px; box-sizing: border-box; padding: 56px; background: #16181c; color: #f4f4f5; font-family: Inter, system-ui, sans-serif; display: flex; gap: 56px; align-items: center">
<svg width="280" height="280" viewBox="0 0 32 32" role="img" aria-label="A potato-shaped TV set with a play button on its screen"><rect width="32" height="32" rx="9" fill="#0b0c0e"></rect><g transform="translate(4 4)"><path d="M7.5 17.5v3M16.5 17.5v3" stroke="#f4f4f5" stroke-width="1.6" stroke-linecap="round"></path><path d="M2 11.6c0-4.6 4.2-7.6 10-7.6s10 2.8 10 7c0 4.6-4.2 7.2-10 7.2S2 15.8 2 11.6z" fill="#F5B544"></path><rect x="6.2" y="7.4" width="11.6" height="7.6" rx="2.2" fill="#0b0c0e"></rect><path d="M10.7 9.4v3.6l3.1-1.8z" fill="#F5B544"></path></g></svg>
<div style="display: flex; flex-direction: column; gap: 48px; flex: 1">
<div style="display: flex; align-items: flex-end; gap: 24px">
<sc-for list="{{sizes}}" as="s" hint-placeholder-count="3"><svg width="{{s.px}}" height="{{s.px}}" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#0b0c0e"></rect><g transform="translate(4 4)"><path d="M7.5 17.5v3M16.5 17.5v3" stroke="#f4f4f5" stroke-width="1.6" stroke-linecap="round"></path><path d="M2 11.6c0-4.6 4.2-7.6 10-7.6s10 2.8 10 7c0 4.6-4.2 7.2-10 7.2S2 15.8 2 11.6z" fill="#F5B544"></path><rect x="6.2" y="7.4" width="11.6" height="7.6" rx="2.2" fill="#0b0c0e"></rect><path d="M10.7 9.4v3.6l3.1-1.8z" fill="#F5B544"></path></g></svg></sc-for>
</div>
<div style="display: flex; align-items: center; gap: 14px">
<svg width="44" height="44" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#0b0c0e"></rect><g transform="translate(4 4)"><path d="M7.5 17.5v3M16.5 17.5v3" stroke="#f4f4f5" stroke-width="1.6" stroke-linecap="round"></path><path d="M2 11.6c0-4.6 4.2-7.6 10-7.6s10 2.8 10 7c0 4.6-4.2 7.2-10 7.2S2 15.8 2 11.6z" fill="#F5B544"></path><rect x="6.2" y="7.4" width="11.6" height="7.6" rx="2.2" fill="#0b0c0e"></rect><path d="M10.7 9.4v3.6l3.1-1.8z" fill="#F5B544"></path></g></svg>
<span style="font-size: 30px; font-weight: 700; letter-spacing: -0.02em">couch potato</span>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":720,"height":440}}'>
class Component extends DCLogic {
renderVals() {
return { sizes: [{ px: 64 }, { px: 32 }, { px: 16 }] };
}
}
</script>
</body>
</html>
